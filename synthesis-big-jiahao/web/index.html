      };

      animateLoop((now) => {
        const t = (now - start) / 1000;
        const width = canvas.width;
        const height = canvas.height;
        const bg = ctx.createLinearGradient(0, 0, width, height);
        bg.addColorStop(0, "#251451");
        bg.addColorStop(0.42, "#5b28ca");
        bg.addColorStop(0.7, "#e33d91");
        bg.addColorStop(1, "#ff9d46");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "rgba(255,255,255,.1)";
        for (let y = 0; y < height; y += 26) {
          for (let x = 0; x < width; x += 26) {
            const pulse = (Math.sin(t * 2 + x * 0.04 + y * 0.03) + 1) * 0.5;
            if ((x / 26 + y / 26) % 3 === 0 && pulse > 0.55) ctx.fillRect(x, y, 7, 7);
          }
        }

        const centerX = width / 2;
        const centerY = 282;
        const ring = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 310);

        shards.forEach((shard) => {
          const progress = clamp((t - shard.delay) / 2.05, 0, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const radius = shard.radius * (1 - eased);
          const angle = shard.angle + (1 - eased) * Math.PI * 0.5;
          const x = centerX + Math.cos(angle) * radius;
          const y = centerY + Math.sin(angle) * radius;
          ctx.fillStyle = shard.color;

        });

        if (t > 1.25) {

          const eased = reducedMotion ? 1 : 1 - Math.pow(1 - assembly, 3);
          const scale = 1.8 + eased * 10.2;
          const spriteWidth = 20 * scale;
          const spriteHeight = 29 * scale;
          const x = centerX - spriteWidth / 2;
          const y = centerY - spriteHeight / 2 + 26;
          ctx.save();
          ctx.globalAlpha = 0.25 + eased * 0.75;
          ctx.shadowColor = "#50e3ff";

          if (t > 2.3) {
            labels.forEach((item, index) => {
              const orbit = t * 0.35 + index * 1.05;
              const lx = centerX + Math.cos(orbit) * (330 + (index % 2) * 30);
              const ly = centerY + Math.sin(orbit * 0.8) * 205;

              ctx.fillRect(lx - 36, ly - 20, 72, 40);
              ctx.strokeStyle = "#21163b";
              ctx.lineWidth = 4;
              ctx.strokeRect(lx - 36, ly - 20, 72, 40);
              ctx.fillStyle = "#21163b";
              ctx.font = "900 15px Consolas, monospace";
              ctx.textAlign = "center";
              ctx.fillText(item.text, lx, ly + 5);
              ctx.textAlign = "left";
            });
          }

          if (t > 3.2) {
            ctx.fillStyle = "#fff4c9";
            ctx.strokeStyle = "#21163b";
            ctx.lineWidth = 4;
            ctx.fillRect(72, 72, 240, 58);
            ctx.strokeRect(72, 72, 240, 58);
            ctx.fillStyle = "#21163b";
            ctx.font = "900 17px 'Microsoft YaHei'";
            ctx.fillText("这个结果，完全在预期内。", 92, 109);

            ctx.fillStyle = "#69f5c1";
            ctx.fillRect(656, 82, 230, 54);
            ctx.strokeRect(656, 82, 230, 54);
            ctx.fillStyle = "#21163b";
            ctx.font = "900 15px Consolas, monospace";
            ctx.fillText("BUILD SUCCESSFUL", 686, 116);
          }

          if (t > 4.2) {
            ctx.fillStyle = "#ffe86a";
            ctx.fillRect(302, 526, 356, 54);
            ctx.strokeStyle = "#21163b";
            ctx.lineWidth = 5;
            ctx.strokeRect(302, 526, 356, 54);
            ctx.fillStyle = "#21163b";
            ctx.font = "900 26px 'Microsoft YaHei'";
            ctx.textAlign = "center";
            ctx.fillText("合成大嘉豪", width / 2, 563);
            ctx.textAlign = "left";
          }
        }

        if (t > 5.1) showEnding();
        return true;
      });

      if (reducedMotion) {
        later(showEnding, 300);
      }
    }

    function resetGame() {
      state = initialGameState();
      initGauge();
      setChapter(0);
      renderIntro();
      toast("进度已重置。嘉豪重新回到环境配置阶段。");
    }

    soundButton.addEventListener("click", () => {
      const willMute = !audio.muted;
      audio.setMuted(willMute);
      soundButton.setAttribute("aria-pressed", String(!willMute));
      soundButton.setAttribute("aria-label", willMute ? "开启声音" : "关闭声音");
      soundButton.textContent = willMute ? "×" : "♪";
      if (!willMute) audio.click();
    });

    document.addEventListener("pointerdown", (event) => {
      const control = event.target.closest("button, .choice, .caption-chip");
      if (!control) return;
      audio.ensure();
      vibrate(8);
      if (!control.closest("[data-no-base-sound]")) audio.click();
    }, { passive: true });

    initGauge();
    setChapter(0);
    renderIntro();
  </script>
</body>
</html>
