<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff4f9a">
  <title>合成大嘉豪</title>
  <style>
    :root {
      --ink: #21163b;
      --deep: #15102b;
      --paper: #fff4c9;
      --cream: #ffeaa2;
      --pink: #ff4f9a;
      --hot: #ff3768;
      --cyan: #4ee7ff;
      --mint: #69f5c1;
      --lemon: #ffe86a;
      --orange: #ff9b42;
      --purple: #a369ff;
      --sky: #58a8ff;
      --accent: #69f5c1;
      --accent-2: #58a8ff;
      --accent-3: #ffe86a;
      --danger: #ff4a62;
      --panel: #fff4c9;
      --panel-ink: #21163b;
      --shadow: 7px 7px 0 var(--ink);
      --pixel: 4px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #4f37c8;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      background:
        linear-gradient(125deg, #5829d9 0%, #ff4f9a 34%, #ff9b42 63%, #4ee7ff 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .24;
      background:
        repeating-linear-gradient(0deg, transparent 0 7px, rgba(255,255,255,.18) 8px 9px),
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.7) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 75%, rgba(255,255,255,.6) 0 2px, transparent 3px);
      background-size: auto, 36px 36px, 52px 52px;
      mix-blend-mode: soft-light;
    }

    body::after {
      content: "";
      position: fixed;
      inset: auto -10vw -20vh;
      height: 50vh;
      z-index: 0;
      pointer-events: none;
      opacity: .45;
      background:
        linear-gradient(90deg, transparent 0 6%, var(--cyan) 6% 12%, transparent 12% 18%, var(--pink) 18% 25%, transparent 25% 33%, var(--lemon) 33% 39%, transparent 39% 47%, var(--mint) 47% 55%, transparent 55% 63%, var(--purple) 63% 71%, transparent 71%);
      clip-path: polygon(0 50%, 6% 36%, 11% 57%, 17% 24%, 24% 62%, 31% 38%, 39% 66%, 46% 30%, 54% 58%, 61% 23%, 69% 64%, 76% 36%, 83% 59%, 91% 29%, 100% 52%, 100% 100%, 0 100%);
      filter: blur(2px);
    }

    button, textarea {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 4px solid var(--lemon);
      outline-offset: 4px;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #app {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 0 30px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 12px;
      color: var(--paper);
      background: rgba(33, 22, 59, .92);
      border: 4px solid var(--ink);
      box-shadow: 6px 6px 0 rgba(33,22,59,.4);
      position: sticky;
      top: 10px;
      z-index: 30;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      position: relative;
      flex: 0 0 auto;
      background: var(--cyan);
      border: 3px solid var(--paper);
      box-shadow: 4px 4px 0 var(--pink);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: var(--ink);
    }

    .brand-mark::before {
      width: 20px;
      height: 8px;
      left: 7px;
      top: 12px;
      box-shadow: 0 11px 0 var(--ink);
    }

    .brand-mark::after {
      width: 6px;
      height: 6px;
      left: 12px;
      top: 13px;
      background: var(--lemon);
      box-shadow: 9px 0 0 var(--lemon), 0 11px 0 var(--pink), 9px 11px 0 var(--pink);
    }

    .brand-name {
      display: block;
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 900;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .brand-sub {
      display: block;
      margin-top: 2px;
      color: var(--mint);
      font-family: Consolas, "Courier New", monospace;
      font-size: 10px;
      letter-spacing: .14em;
      white-space: nowrap;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      min-width: 0;
    }

    .chapter-pill {
      max-width: 240px;
      padding: 7px 10px;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--accent);
      font-size: 12px;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gauge-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .gauge-label {
      color: var(--lemon);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .gauge {
      display: grid;
      grid-template-columns: repeat(7, 10px);
      grid-auto-rows: 10px;
      gap: 3px;
      padding: 5px;
      background: #0f0b23;
      border: 2px solid var(--paper);
    }

    .gauge-cell {
      width: 10px;
      height: 10px;
      background: #382857;
      border: 1px solid rgba(255,255,255,.12);
      transform-origin: center;
    }

    .gauge-cell.filled {
      border-color: rgba(33,22,59,.8);
      animation: gaugePop .36s steps(4, end);
    }

    .gauge-cell.current {
      box-shadow: 0 0 0 2px var(--paper), 0 0 10px var(--lemon);
    }

    .gauge-count {
      min-width: 46px;
      color: var(--paper);
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      color: var(--ink);
      background: var(--cyan);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--pink);
      font-size: 18px;
      font-weight: 900;
      transition: transform .08s steps(2, end), box-shadow .08s steps(2, end);
    }

    .icon-button[aria-pressed="false"] {
      background: var(--purple);
      color: var(--paper);
    }

    .icon-button:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--pink);
    }

    #stage {
      margin-top: 18px;
      min-height: 620px;
    }

    .screen {
      animation: screenIn .36s steps(5, end);
    }

    .pixel-panel {
      position: relative;
      background: var(--panel);
      border: 4px solid var(--ink);
      box-shadow: var(--shadow);
    }

    .pixel-panel::after {
      content: "";
      position: absolute;
      inset: 7px;
      border: 2px dashed rgba(33,22,59,.16);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-block;
      padding: 4px 8px;
      color: var(--ink);
      background: var(--accent);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .primary-button,
    .secondary-button,
    .mini-button {
      position: relative;
      min-height: 46px;
      padding: 12px 18px;
      border: 3px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      font-weight: 900;
      text-align: center;
      transition: transform .08s steps(2, end), box-shadow .08s steps(2, end), filter .12s;
    }

    .primary-button {
      color: var(--ink);
      background: var(--lemon);
    }

    .secondary-button {
      color: var(--ink);
      background: var(--cyan);
    }

    .mini-button {
      min-height: 38px;
      padding: 7px 11px;
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 12px;
      background: var(--paper);
    }

    .primary-button:hover,
    .secondary-button:hover,
    .mini-button:hover {
      filter: brightness(1.06) saturate(1.12);
      transform: translate(-1px, -1px);
    }

    .primary-button:active,
    .secondary-button:active,
    .mini-button:active {
      transform: translate(5px, 5px);
      box-shadow: 0 0 0 var(--ink);
    }

    .intro-screen {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(310px, .7fr);
      gap: 22px;
      align-items: stretch;
    }

    .hero-card {
      min-height: 520px;
      padding: clamp(24px, 5vw, 58px);
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), transparent 38%),
        var(--paper);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      right: -65px;
      top: -65px;
      background:
        repeating-conic-gradient(from 0deg, var(--pink) 0 15deg, var(--lemon) 15deg 30deg);
      border: 4px solid var(--ink);
      animation: spin 22s steps(48, end) infinite;
      opacity: .9;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 14px solid transparent;
      border-image: repeating-linear-gradient(90deg, var(--cyan) 0 18px, var(--pink) 18px 36px, var(--lemon) 36px 54px) 14;
      pointer-events: none;
    }

    .hero-kicker {
      position: relative;
      z-index: 2;
      color: var(--ink);
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .14em;
    }

    .game-title {
      position: relative;
      z-index: 2;
      max-width: 720px;
      margin: 18px 0 14px;
      font-size: clamp(52px, 9vw, 108px);
      font-weight: 900;
      line-height: .9;
      letter-spacing: -.08em;
      text-shadow:
        6px 6px 0 var(--cyan),
        12px 12px 0 var(--ink);
    }

    .game-title span {
      color: var(--pink);
      -webkit-text-stroke: 3px var(--ink);
    }

    .hero-lead {
      position: relative;
      z-index: 2;
      max-width: 620px;
      margin: 28px 0 28px;
      padding: 16px 18px;
      background: var(--accent);
      border: 3px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 800;
      line-height: 1.7;
    }

    .hero-actions {
      position: relative;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .hero-note {
      max-width: 240px;
      font-size: 12px;
      line-height: 1.6;
      opacity: .75;
    }

    .hero-side {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .avatar-panel {
      padding: 18px;
      background: var(--purple);
      color: var(--paper);
      min-height: 260px;
    }

    .avatar-panel canvas {
      width: 100%;
      max-height: 230px;
      object-fit: contain;
      filter: drop-shadow(8px 8px 0 rgba(33,22,59,.35));
    }

    .avatar-caption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: end;
      margin-top: 8px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      font-weight: 900;
    }

    .rule-panel {
      padding: 18px;
      background: var(--lemon);
    }

    .rule-panel h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .rule-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.55;
    }

    .rule-list li {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
      align-items: start;
    }

    .rule-list b {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      background: var(--pink);
      color: var(--paper);
      border: 2px solid var(--ink);
      font-family: Consolas, monospace;
      font-size: 11px;
    }

    .chapter-screen {
      display: grid;
      place-items: center;
      min-height: 620px;
      padding: 20px;
    }

    .chapter-card {
      width: min(780px, 100%);
      padding: clamp(28px, 6vw, 64px);
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(255,255,255,.18), transparent 50%),
        var(--accent);
    }

    .chapter-card::before {
      content: ">>>";
      position: absolute;
      right: 20px;
      bottom: -34px;
      color: rgba(33,22,59,.08);
      font-family: Consolas, monospace;
      font-size: 180px;
      font-weight: 900;
      letter-spacing: -.2em;
    }

    .chapter-number {
      position: relative;
      z-index: 2;
      font-family: Consolas, monospace;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .14em;
    }

    .chapter-title {
      position: relative;
      z-index: 2;
      margin: 16px 0;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1;
      letter-spacing: -.075em;
      text-shadow: 4px 4px 0 var(--paper);
    }

    .chapter-tagline {
      position: relative;
      z-index: 2;
      max-width: 620px;
      margin: 0 0 26px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.75;
    }

    .chapter-steps {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .chapter-step {
      padding: 7px 10px;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 12px;
      font-weight: 900;
    }

    .story-screen {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(330px, .88fr);
      gap: 18px;
      align-items: stretch;
    }

    .scene-card {
      min-height: 580px;
      overflow: hidden;
      background: var(--accent-2);
    }

    .scene-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      pointer-events: none;
    }

    .scene-badge,
    .level-badge {
      padding: 6px 9px;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      font-family: Consolas, monospace;
      font-size: 11px;
      font-weight: 900;
    }

    .level-badge {
      background: var(--lemon);
    }

    #storyCanvas {
      width: 100%;
      height: auto;
      min-height: 100%;
      object-fit: cover;
    }

    .scene-caption {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 3;
      padding: 11px 14px;
      color: var(--paper);
      background: rgba(33,22,59,.9);
      border: 2px solid var(--paper);
      font-family: Consolas, monospace;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .dialog-card {
      display: flex;
      flex-direction: column;
      padding: 22px;
      background: var(--paper);
    }

    .speaker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 3px dashed rgba(33,22,59,.3);
    }

    .speaker-avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      background: var(--cyan);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--pink);
    }

    .speaker-name {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .speaker-role {
      margin: 3px 0 0;
      font-family: Consolas, monospace;
      font-size: 10px;
      letter-spacing: .08em;
      opacity: .7;
    }

    .scene-title {
      margin: 8px 0 10px;
      font-size: clamp(25px, 3vw, 38px);
      line-height: 1.15;
      letter-spacing: -.04em;
    }

    .scene-copy {
      display: grid;
      gap: 8px;
      margin: 0 0 16px;
      color: #3d2b5c;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.72;
    }

    .chat-lines {
      display: grid;
      gap: 7px;
      margin: 4px 0 14px;
    }

    .chat-line {
      width: fit-content;
      max-width: 94%;
      padding: 8px 11px;
      background: var(--accent);
      border: 2px solid var(--ink);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.5;
    }

    .chat-line:nth-child(2n) {
      justify-self: end;
      background: var(--cyan);
    }

    .choices {
      display: grid;
      gap: 10px;
      margin-top: auto;
    }

    .choice {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 9px 12px 9px 9px;
      color: var(--ink);
      background: #fff9df;
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      text-align: left;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.48;
      transition: transform .08s steps(2, end), box-shadow .08s steps(2, end), background .12s;
    }

    .choice-key {
      display: grid;
      place-items: center;
      width: 33px;
      height: 33px;
      color: var(--paper);
      background: var(--purple);
      border: 2px solid var(--ink);
      font-family: Consolas, monospace;
      font-size: 14px;
      font-weight: 900;
    }

    .choice:hover {
      background: var(--lemon);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--ink);
    }

    .choice:active {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 var(--ink);
    }

    .choice.wrong {
      background: #ffb1c2;
      animation: shake .26s steps(3, end) 2;
    }

    .choice.correct {
      background: var(--mint);
      box-shadow: 0 0 0 var(--ink), 0 0 0 5px var(--lemon);
    }

    .choice:disabled {
      cursor: default;
      opacity: .72;
    }

    .choice:disabled:hover {
      transform: none;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .feedback {
      min-height: 50px;
      margin-top: 12px;
      padding: 10px 12px;
      color: var(--paper);
      background: var(--ink);
      border: 2px solid var(--ink);
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: 12px;
      font-weight: 750;
      line-height: 1.55;
    }

    .feedback.good {
      color: var(--ink);
      background: var(--lemon);
    }

    .feedback.bad {
      animation: shake .2s steps(3, end) 2;
    }

    .challenge-intro {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(320px, 1.1fr);
      gap: 18px;
      min-height: 580px;
    }

    .challenge-art {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.15) 0 12px, transparent 12px 24px),
        var(--accent);
      min-height: 420px;
    }

    .challenge-glyph {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: min(300px, 72%);
      aspect-ratio: 1;
      color: var(--paper);
      background: var(--pink);
      border: 8px solid var(--ink);
      box-shadow: 16px 16px 0 var(--ink), inset 0 0 0 7px var(--lemon);
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: clamp(68px, 12vw, 132px);
      font-weight: 900;
      text-shadow: 6px 6px 0 var(--ink);
      transform: rotate(-4deg);
    }

    .challenge-copy-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(24px, 5vw, 52px);
      background: var(--paper);
    }

    .challenge-copy-card h2 {
      margin: 14px 0 12px;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1;
      letter-spacing: -.06em;
    }

    .challenge-copy-card p {
      margin: 0 0 16px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.75;
    }

    .challenge-hints {
      display: grid;
      gap: 8px;
      margin: 6px 0 26px;
    }

    .challenge-hint {
      padding: 9px 11px;
      background: var(--accent);
      border: 2px solid var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .game-screen {
      display: grid;
      gap: 12px;
    }

    .game-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      color: var(--paper);
      background: var(--ink);
      border: 3px solid var(--ink);
    }

    .game-name {
      font-size: 14px;
      font-weight: 900;
    }

    .timer {
      color: var(--lemon);
      font-family: Consolas, monospace;
      font-size: 14px;
      font-weight: 900;
    }

    .booth-wrap {
      position: relative;
      min-height: 500px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,.3) 0 8px, transparent 9px),
        linear-gradient(135deg, #ff67b1, #ffb447 45%, #53d9ff);
      border: 5px solid var(--ink);
      box-shadow: var(--shadow);
    }

    .booth {
      position: absolute;
      inset: 50px 6% 38px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.14) 50%, transparent 50%),
        linear-gradient(0deg, rgba(255,255,255,.12) 50%, transparent 50%),
        #5f3bcc;
      background-size: 34px 34px;
      border: 7px solid var(--ink);
      box-shadow: inset 0 0 0 8px var(--cyan), 10px 10px 0 rgba(33,22,59,.35);
      overflow: hidden;
    }

    .booth::before {
      content: "CLICK THE NOTES!";
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 10px;
      color: var(--ink);
      background: var(--lemon);
      border: 2px solid var(--ink);
      font-family: Consolas, monospace;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .note-button {
      position: absolute;
      display: grid;
      place-items: center;
      width: clamp(60px, 8vw, 82px);
      height: clamp(60px, 8vw, 82px);
      color: var(--ink);
      background: var(--lemon);
      border: 5px solid var(--ink);
      box-shadow: 6px 6px 0 var(--pink);
      font-family: Georgia, serif;
      font-size: clamp(27px, 4vw, 42px);
      font-weight: 900;
      animation: noteBob .72s steps(3, end) infinite alternate;
      touch-action: manipulation;
    }

    .note-button:nth-of-type(2n) {
      color: var(--paper);
      background: var(--pink);
      box-shadow: 6px 6px 0 var(--cyan);
    }

    .note-button:nth-of-type(3n) {
      background: var(--mint);
      box-shadow: 6px 6px 0 var(--purple);
    }

    .note-button.hit {
      pointer-events: none;
      animation: noteHit .32s steps(5, end) forwards;
    }

    .booth-bottom {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      padding: 6px 14px;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      font-family: Consolas, monospace;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .game-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(33,22,59,.82);
      text-align: center;
    }

    .overlay-card {
      width: min(440px, 100%);
      padding: 26px;
      color: var(--ink);
      background: var(--paper);
      border: 4px solid var(--ink);
      box-shadow: 8px 8px 0 var(--pink);
    }

    .overlay-card h2 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    .overlay-card p {
      margin: 0 0 20px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.7;
    }

    .skate-frame {
      position: relative;
      overflow: hidden;
      border: 5px solid var(--ink);
      box-shadow: var(--shadow);
      background: var(--sky);
      touch-action: none;
    }

    #skateCanvas {
      width: 100%;
      height: auto;
    }

    .skate-hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .skate-chip {
      padding: 6px 9px;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      font-family: Consolas, monospace;
      font-size: 12px;
      font-weight: 900;
    }

    .skate-controls {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .lane-button {
      width: 72px;
      height: 46px;
      color: var(--ink);
      background: var(--lemon);
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      font-size: 22px;
      font-weight: 900;
    }

    .wire-board {
      position: relative;
      min-height: 540px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.25), transparent 30%),
        linear-gradient(150deg, #8c5cff, #f04f9e 50%, #ff9d4d);
      border: 5px solid var(--ink);
      box-shadow: var(--shadow);
      touch-action: none;
    }

    .projector {
      position: absolute;
      left: 50%;
      top: 20px;
      width: min(480px, 62%);
      transform: translateX(-50%);
    }

    .projector-body {
      position: relative;
      height: 180px;
      background: #2d2360;
      border: 6px solid var(--ink);
      box-shadow: inset 0 0 0 7px var(--cyan);
    }

    .projector-screen {
      position: absolute;
      inset: 18px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--paper);
      background: #1a171f;
      border: 3px solid var(--ink);
      font-family: Consolas, monospace;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
    }

    .projector-screen.on {
      color: var(--ink);
      background:
        linear-gradient(180deg, var(--cyan) 0 25%, var(--lemon) 25% 50%, var(--orange) 50% 75%, var(--pink) 75%);
      animation: rainbowJolt .5s steps(2, end) 2;
    }

    .projector-stand {
      width: 90px;
      height: 48px;
      margin: 0 auto;
      background: #4a318b;
      border: 5px solid var(--ink);
      border-top: 0;
    }

    .port-row {
      position: absolute;
      left: 50%;
      top: 240px;
      display: flex;
      justify-content: center;
      gap: clamp(16px, 5vw, 56px);
      width: 100%;
      transform: translateX(-50%);
    }

    .port {
      display: grid;
      place-items: center;
      gap: 3px;
      width: 94px;
      height: 86px;
      color: var(--ink);
      background: var(--paper);
      border: 5px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      font-size: 12px;
      font-weight: 900;
    }

    .port span {
      font-family: Consolas, monospace;
      font-size: 25px;
      line-height: 1;
    }

    .port.active {
      background: var(--mint);
      box-shadow: 0 0 0 6px var(--lemon), 5px 5px 0 var(--ink);
    }

    .cable {
      position: absolute;
      z-index: 8;
      display: grid;
      grid-template-columns: 32px 1fr;
      align-items: center;
      gap: 8px;
      min-width: 132px;
      min-height: 58px;
      padding: 8px 10px;
      color: var(--ink);
      background: var(--paper);
      border: 4px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      font-size: 11px;
      font-weight: 900;
      touch-action: none;
      user-select: none;
    }

    .cable::before {
      content: "";
      position: absolute;
      left: -54px;
      top: 50%;
      width: 56px;
      height: 9px;
      background: var(--cable-color, var(--cyan));
      border: 3px solid var(--ink);
      transform: translateY(-50%);
    }

    .cable-symbol {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      background: var(--cable-color, var(--cyan));
      border: 2px solid var(--ink);
      font-family: Consolas, monospace;
      font-size: 18px;
    }

    .cable.dragging {
      z-index: 30;
      transform: scale(1.06) rotate(-1deg);
      box-shadow: 8px 8px 0 var(--pink);
    }

    .cable.wrong {
      animation: shake .2s steps(3, end) 2;
    }

    .cable.connected {
      pointer-events: none;
      opacity: 0;
    }

    .checkin-screen {
      display: grid;
      grid-template-columns: minmax(320px, .85fr) minmax(0, 1.15fr);
      gap: 18px;
      align-items: stretch;
    }

    .photo-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(18px, 4vw, 38px);
      background: var(--accent);
    }

    .photo-frame {
      position: relative;
      padding: 14px 14px 44px;
      background: #fff7d8;
      border: 5px solid var(--ink);
      box-shadow: 10px 10px 0 var(--ink);
      transform: rotate(-1.5deg);
    }

    .photo-frame::before,
    .photo-frame::after {
      content: "";
      position: absolute;
      width: 82px;
      height: 26px;
      top: -13px;
      background: var(--lemon);
      border: 2px solid var(--ink);
      opacity: .9;
    }

    .photo-frame::before {
      left: 18px;
      transform: rotate(-6deg);
    }

    .photo-frame::after {
      right: 18px;
      transform: rotate(5deg);
      background: var(--cyan);
    }

    #snapshotCanvas {
      width: 100%;
      height: auto;
      background: var(--purple);
      border: 3px solid var(--ink);
    }

    .photo-stamp {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 11px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #45315e;
      font-family: Consolas, monospace;
      font-size: 10px;
      font-weight: 900;
    }

    .photo-note {
      margin-top: 24px;
      padding: 12px;
      color: var(--paper);
      background: var(--ink);
      border: 2px solid var(--ink);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.6;
    }

    .chat-card {
      display: flex;
      flex-direction: column;
      padding: 20px;
      background: var(--paper);
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--ink);
    }

    .chat-title {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
    }

    .chat-online {
      color: var(--ink);
      background: var(--mint);
      border: 2px solid var(--ink);
      padding: 4px 7px;
      font-family: Consolas, monospace;
      font-size: 10px;
      font-weight: 900;
    }

    .chat-stream {
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-height: 290px;
      min-height: 170px;
      margin: 14px 0;
      padding: 12px;
      overflow-y: auto;
      background: #fff9df;
      border: 3px solid var(--ink);
    }

    .bubble {
      width: fit-content;
      max-width: 92%;
      padding: 8px 10px;
      background: #e5d9ff;
      border: 2px solid var(--ink);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.55;
      animation: bubbleIn .24s steps(3, end);
    }

    .bubble.mine {
      align-self: flex-end;
      background: var(--mint);
    }

    .bubble .who {
      display: block;
      margin-bottom: 3px;
      color: #72589b;
      font-family: Consolas, monospace;
      font-size: 9px;
      font-weight: 900;
    }

    .caption-wrap {
      margin-top: auto;
    }

    .caption-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 900;
    }

    .caption-input {
      width: 100%;
      min-height: 88px;
      padding: 12px;
      color: var(--ink);
      background: #fff9df;
      border: 3px solid var(--ink);
      box-shadow: inset 4px 4px 0 rgba(33,22,59,.08);
      resize: vertical;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
    }

    .caption-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 9px 0 12px;
    }

    .caption-chip {
      padding: 6px 8px;
      background: var(--accent);
      border: 2px solid var(--ink);
      font-size: 11px;
      font-weight: 800;
    }

    .caption-error {
      min-height: 18px;
      margin: 8px 0 0;
      color: var(--danger);
      font-size: 12px;
      font-weight: 900;
    }

    .checkin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .success-screen {
      min-height: 620px;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.35), transparent 35%),
        var(--accent);
      border: 5px solid var(--ink);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .success-card {
      width: min(620px, 100%);
      padding: clamp(26px, 6vw, 58px);
      background: var(--paper);
      border: 4px solid var(--ink);
      box-shadow: 9px 9px 0 var(--ink);
    }

    .success-card h2 {
      margin: 10px 0;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1;
      letter-spacing: -.06em;
    }

    .success-card p {
      margin: 0 auto 22px;
      max-width: 480px;
      font-size: 15px;
      font-weight: 750;
      line-height: 1.7;
    }

    .synth-screen {
      position: relative;
      min-height: 620px;
      overflow: hidden;
      background: #241343;
      border: 5px solid var(--ink);
      box-shadow: var(--shadow);
    }

    #synthCanvas {
      width: 100%;
      height: auto;
      min-height: 620px;
    }

    .synth-overlay {
      position: absolute;
      left: 50%;
      bottom: 24px;
      z-index: 4;
      width: min(720px, calc(100% - 36px));
      transform: translateX(-50%);
      pointer-events: none;
    }

    .synth-end-card {
      padding: 22px;
      color: var(--ink);
      background: var(--paper);
      border: 4px solid var(--ink);
      box-shadow: 8px 8px 0 var(--pink);
      text-align: center;
      pointer-events: auto;
      animation: bubbleIn .4s steps(4, end);
    }

    .synth-end-card h2 {
      margin: 5px 0 6px;
      font-size: clamp(30px, 5vw, 52px);
      letter-spacing: -.05em;
    }

    .synth-end-card p {
      margin: 0 auto 14px;
      max-width: 560px;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.65;
    }

    .synth-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin: 12px 0 16px;
    }

    .synth-tag {
      padding: 5px 8px;
      background: var(--accent);
      border: 2px solid var(--ink);
      font-family: Consolas, monospace;
      font-size: 10px;
      font-weight: 900;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100;
      max-width: calc(100% - 28px);
      padding: 11px 16px;
      color: var(--ink);
      background: var(--lemon);
      border: 3px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
      transform: translate(-50%, 30px);
      opacity: 0;
      pointer-events: none;
      transition: transform .18s steps(3, end), opacity .18s steps(3, end);
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .screen-flash {
      position: fixed;
      inset: 0;
      z-index: 90;
      pointer-events: none;
      background: #fff8cf;
      animation: flashOut .34s steps(5, end) forwards;
    }

    .confetti {
      position: fixed;
      z-index: 95;
      width: 9px;
      height: 9px;
      background: var(--confetti-color, var(--pink));
      border: 1px solid var(--ink);
      pointer-events: none;
      animation: confettiBurst .75s cubic-bezier(.2,.8,.3,1) forwards;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(8px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes gaugePop {
      0% { transform: scale(.3); }
      60% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    @keyframes noteBob {
      from { translate: 0 0; }
      to { translate: 0 -9px; }
    }

    @keyframes noteHit {
      0% { opacity: 1; transform: scale(1); }
      55% { opacity: 1; transform: scale(1.5) rotate(12deg); }
      100% { opacity: 0; transform: scale(.1) rotate(40deg); }
    }

    @keyframes rainbowJolt {
      0% { filter: hue-rotate(0deg) brightness(1); }
      50% { filter: hue-rotate(90deg) brightness(1.2); }
      100% { filter: hue-rotate(0deg) brightness(1); }
    }

    @keyframes flashOut {
      from { opacity: .92; }
      to { opacity: 0; }
    }

    @keyframes confettiBurst {
      from { opacity: 1; transform: translate(0,0) rotate(0); }
      to { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(240deg); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 880px) {
      #app {
        width: min(100% - 18px, 760px);
        padding-top: 9px;
      }

      .topbar {
        top: 5px;
        gap: 9px;
        padding: 8px;
      }

      .brand-sub,
      .chapter-pill {
        display: none;
      }

      .hud {
        gap: 8px;
      }

      .gauge {
        grid-template-columns: repeat(7, 8px);
        grid-auto-rows: 8px;
        gap: 2px;
        padding: 4px;
      }

      .gauge-cell {
        width: 8px;
        height: 8px;
      }

      .gauge-label {
        display: none;
      }

      .gauge-count {
        min-width: 38px;
        font-size: 10px;
      }

      .icon-button {
        width: 36px;
        height: 36px;
      }

      .intro-screen,
      .story-screen,
      .challenge-intro,
      .checkin-screen {
        grid-template-columns: 1fr;
      }

      .hero-card {
        min-height: 500px;
      }

      .hero-side {
        grid-template-columns: 1fr 1fr;
      }

      .scene-card {
        min-height: 360px;
      }

      .dialog-card {
        min-height: 470px;
      }

      .challenge-art {
        min-height: 300px;
      }

      .booth-wrap {
        min-height: 440px;
      }

      .wire-board {
        min-height: 500px;
      }

      .projector {
        width: 72%;
      }

      .photo-column {
        padding: 20px;
      }

      .photo-frame {
        width: min(520px, 100%);
        margin: 0 auto;
      }
    }

    @media (max-width: 540px) {
      .brand-name {
        font-size: 14px;
      }

      .brand-mark {
        width: 31px;
        height: 31px;
      }

      .brand-mark::before {
        left: 5px;
        top: 9px;
      }

      .hero-card {
        min-height: 550px;
        padding: 24px 20px;
      }

      .game-title {
        font-size: clamp(44px, 16vw, 72px);
      }

      .hero-side {
        grid-template-columns: 1fr;
      }

      .scene-card {
        min-height: 310px;
      }

      .dialog-card,
      .chat-card {
        padding: 16px;
      }

      .choice {
        grid-template-columns: 31px 1fr;
        font-size: 12px;
      }

      .choice-key {
        width: 30px;
        height: 30px;
      }

      .booth-wrap {
        min-height: 390px;
      }

      .booth {
        inset: 46px 4% 34px;
      }

      .note-button {
        width: 56px;
        height: 56px;
        border-width: 4px;
      }

      .wire-board {
        min-height: 490px;
      }

      .projector {
        width: 78%;
      }

      .projector-body {
        height: 150px;
      }

      .port-row {
        top: 214px;
        gap: 10px;
      }

      .port {
        width: 82px;
        height: 76px;
      }

      .cable {
        min-width: 112px;
        grid-template-columns: 28px 1fr;
        font-size: 10px;
      }

      .cable::before {
        left: -34px;
        width: 36px;
      }

      .synth-screen,
      #synthCanvas {
        min-height: 520px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <span class="brand-name">合成大嘉豪</span>
          <span class="brand-sub">COURSE PROJECT WEEK // 21 SHARDS</span>
        </span>
      </div>
      <div class="hud">
        <div class="chapter-pill" id="chapterPill">第一章 · 环境还没配好</div>
        <div class="gauge-wrap">
          <span class="gauge-label">豪意值</span>
          <div class="gauge" id="gauge" role="progressbar" aria-label="豪意值" aria-valuemin="0" aria-valuemax="21" aria-valuenow="0"></div>
          <span class="gauge-count" id="gaugeCount">0 / 21</span>
        </div>

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.master = null;
        this.musicGain = null;
        this.sfxGain = null;
        this.started = false;
        this.muted = false;
        this.musicTimer = null;
        this.step = 0;
        this.nextTime = 0;
        this.stepDuration = 60 / 112 / 2;
        this.melody = [
          523.25, 0, 659.25, 783.99, 659.25, 0, 523.25, 0,
          440.00, 0, 523.25, 659.25, 587.33, 0, 440.00, 0,
          349.23, 0, 440.00, 523.25, 523.25, 0, 440.00, 0,
          392.00, 0, 493.88, 587.33, 523.25, 0, 392.00, 0
        ];
        this.bass = [130.81, 110.00, 87.31, 98.00];
      }

      ensure() {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return false;
        if (!this.ctx) {
          this.ctx = new AudioCtor();
          this.master = this.ctx.createGain();
          this.musicGain = this.ctx.createGain();
          this.sfxGain = this.ctx.createGain();
          this.master.gain.value = this.muted ? 0 : 0.9;
          this.musicGain.gain.value = 0.34;
          this.sfxGain.gain.value = 0.8;
          this.musicGain.connect(this.master);
          this.sfxGain.connect(this.master);
          this.master.connect(this.ctx.destination);
        }
        if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
        return true;
      }

      tone(freq, duration = 0.08, type = "square", gain = 0.04, when = null, slide = 0) {
        if (!this.ensure()) return;
        const start = when ?? this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const env = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(Math.max(30, freq), start);
        if (slide) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), start + duration);
        }
        env.gain.setValueAtTime(0.0001, start);
        env.gain.exponentialRampToValueAtTime(gain, start + 0.012);
        env.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(env);
        env.connect(this.sfxGain);
        osc.start(start);
        osc.stop(start + duration + 0.02);
      }

      noise(duration = 0.06, gain = 0.035, when = null, highpass = 900) {
        if (!this.ensure()) return;
        const start = when ?? this.ctx.currentTime;
        const length = Math.max(1, Math.floor(this.ctx.sampleRate * duration));
        const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) data[i] = Math.random() * 2 - 1;
        const source = this.ctx.createBufferSource();
        const filter = this.ctx.createBiquadFilter();
        const env = this.ctx.createGain();
        source.buffer = buffer;
        filter.type = "highpass";
        filter.frequency.value = highpass;
        env.gain.setValueAtTime(gain, start);
        env.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        source.connect(filter);
        filter.connect(env);
        env.connect(this.sfxGain);
        source.start(start);
      }

        this.tone(185, 0.14, "square", 0.018, this.ctx?.currentTime + 0.13, -30);
      }

      typingStorm() {
        const now = this.ctx?.currentTime;
        for (let index = 0; index < 13; index += 1) {
          this.tone(
            480 + (index % 4) * 85,
            0.026,
            "square",
            0.018,
            now ? now + index * 0.043 : null
          );
        }
        this.noise(0.12, 0.018, now ? now + 0.18 : null, 1800);
      }

      connect() {
        this.tone(420, 0.05, "square", 0.04);
        this.tone(760, 0.1, "triangle", 0.055, this.ctx?.currentTime + 0.03);
      }

      shutter() {
        this.noise(0.07, 0.07, null, 1200);
        this.tone(120, 0.05, "square", 0.04);
      }

      success() {
        const now = this.ctx?.currentTime;
        [659.25, 783.99, 987.77, 1318.51].forEach((freq, index) => {
          this.tone(freq, 0.2, "triangle", 0.05, now ? now + index * 0.075 : null);
        });
      }

      fanfare() {
        const now = this.ctx?.currentTime;
        [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
          this.tone(freq, 0.32, index % 2 ? "triangle" : "square", 0.045, now ? now + index * 0.11 : null);
        });
        this.noise(0.35, 0.035, now ? now + 0.35 : null, 500);
      }

      startMusic() {
        if (!this.ensure() || this.started) return;
        this.started = true;
        this.nextTime = this.ctx.currentTime + 0.08;
        this.musicTimer = window.setInterval(() => this.scheduleMusic(), 70);
      }

      scheduleMusic() {
        if (!this.ctx || !this.started) return;
        while (this.nextTime < this.ctx.currentTime + 0.18) {
          const stepIndex = this.step % this.melody.length;
          const lead = this.melody[stepIndex];
          if (lead) {
            const osc = this.ctx.createOscillator();
            const env = this.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.value = lead;
            env.gain.setValueAtTime(0.0001, this.nextTime);
            env.gain.exponentialRampToValueAtTime(0.035, this.nextTime + 0.015);
            env.gain.exponentialRampToValueAtTime(0.0001, this.nextTime + this.stepDuration * 0.82);
            osc.connect(env);
            env.connect(this.musicGain);
            osc.start(this.nextTime);
            osc.stop(this.nextTime + this.stepDuration * 0.9);
          }
          if (stepIndex % 4 === 0) {
            const root = this.bass[Math.floor(stepIndex / 8) % this.bass.length];
            const bass = this.ctx.createOscillator();
            const bassEnv = this.ctx.createGain();
            bass.type = "square";
            bass.frequency.value = root;
            bassEnv.gain.setValueAtTime(0.0001, this.nextTime);
            bassEnv.gain.exponentialRampToValueAtTime(0.017, this.nextTime + 0.02);
            bassEnv.gain.exponentialRampToValueAtTime(0.0001, this.nextTime + this.stepDuration * 1.3);
            bass.connect(bassEnv);
            bassEnv.connect(this.musicGain);
            bass.start(this.nextTime);
            bass.stop(this.nextTime + this.stepDuration * 1.4);
          }
          if (stepIndex % 2 === 1) {
            this.noise(0.018, 0.008, this.nextTime, 3200);
          }
          this.nextTime += this.stepDuration;
          this.step += 1;
        }
      }

      setMuted(muted) {
        this.muted = muted;
        if (this.ensure()) {
          this.master.gain.setTargetAtTime(muted ? 0 : 0.9, this.ctx.currentTime, 0.02);
        }
      }

    function clearActive() {
      activeTimers.forEach((id) => clearTimeout(id));
      activeTimers = [];
      activeRafs.forEach((id) => cancelAnimationFrame(id));
      activeRafs = [];
      if (activeKeydown) {

    function later(fn, delay) {
      const id = window.setTimeout(() => {
        activeTimers = activeTimers.filter((timerId) => timerId !== id);
        fn();
      }, delay);
      activeTimers.push(id);
      return id;
    }

    function animateLoop(callback) {
      let running = true;
      let last = performance.now();
      const frame = (now) => {
        if (!running) return;
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const shouldContinue = callback(now, dt);
        if (shouldContinue === false) {
          running = false;
          return;
        }
        const id = requestAnimationFrame(frame);
        activeRafs.push(id);
      };
      const id = requestAnimationFrame(frame);
      activeRafs.push(id);
      return () => { running = false; };
    }

    function getOptionOrder(levelId) {
      if (state.optionOrders[levelId]) return state.optionOrders[levelId];
      const order = [0, 1, 2];
      let correctPosition = 2;
      do {
        for (let index = order.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [order[index], order[swapIndex]] = [order[swapIndex], order[index]];
        }
        correctPosition = order.indexOf(2);
      } while (correctPosition === state.lastCorrectPosition);
      state.optionOrders[levelId] = order;
      state.lastCorrectPosition = correctPosition;
      return order;
    }

              <span class="hero-note">点击后会启用背景音乐、音效与设备震动；触屏与键盘都可游玩。</span>
            </div>
          </div>
          <aside class="hero-side">
            <div class="avatar-panel pixel-panel">
              <canvas id="introAvatar" width="520" height="330" aria-label="黑色卷发、戴眼镜的嘉豪像素小人"></canvas>
              <div class="avatar-caption"><span>SUBJECT: JIAHAO</span><span>STATUS: VERY CONFIDENT</span></div>
            </div>
            <div class="rule-panel pixel-panel">
              <h2>通关方式</h2>
              <ul class="rule-list">
                <li><b>15</b><span>剧情选择，每题只有一个嘉豪答案。</span></li>
                <li><b>03</b><span>小游戏，商场、校园和机房各一次。</span></li>
                <li><b>03</b><span>班级群打卡，不发送就不能继续。</span></li>
              </ul>
            </div>
          </aside>
        </section>
      `);
      const avatar = document.getElementById("introAvatar");
      const ctx = avatar.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = "#21163b";
      ctx.fillRect(0, 0, avatar.width, avatar.height);
      for (let y = 20; y < 330; y += 24) {
        for (let x = 20; x < 520; x += 24) {
          ctx.fillStyle = (x / 24 + y / 24) % 2 ? "#4f37c8" : "#6f4be8";
          ctx.fillRect(x, y, 12, 12);
        }
      }
      drawJiahao(ctx, 172, 30, 9);
      const startButton = document.getElementById("startGame");
      startButton.addEventListener("click", () => {
        audio.ensure();
        audio.startMusic();
        state.started = true;
        renderChapterIntro(0);
      });
    }

    function renderChapterIntro(chapterIndex) {
      const chapter = CHAPTERS[chapterIndex];
      setChapter(chapterIndex);
      state.chapter = chapterIndex;
      state.level = chapterIndex * 5;
      setStage(`
        <section class="screen chapter-screen">
          <div class="chapter-card pixel-panel">
            <div class="chapter-number">${chapter.number} // 7 SHARDS</div>
            <h2 class="chapter-title">${chapter.title.replace(/^第.+章 · /, "")}</h2>
            <p class="chapter-tagline">${chapter.tagline}</p>
            <div class="chapter-steps">
              <span class="chapter-step">5 次剧情选择</span>
              <span class="chapter-step">1 个像素小游戏</span>
              <span class="chapter-step">1 次班级群打卡</span>
              <span class="chapter-step">+7 豪意值</span>
            </div>
            <button class="primary-button" id="chapterStart" type="button">进入第 ${state.level + 1} 关</button>
          </div>
        </section>
      `);
      document.getElementById("chapterStart").addEventListener("click", () => renderStory());
    }

    function renderStory() {
      const level = LEVELS[state.level];
      if (!level) {
        renderSynth();
        return;
      }
      setChapter(level.chapter);
      const optionOrder = getOptionOrder(level.id);
      const messageHTML = level.messages.length
        ? `<div class="chat-lines">${level.messages.map((message) => `<div class="chat-line">${escapeHTML(message)}</div>`).join("")}</div>`
        : "";
      setStage(`
        <section class="screen story-screen">
          <div class="scene-card pixel-panel">
            <div class="scene-header">
              <span class="scene-badge">${CHAPTERS[level.chapter].short}</span>
              <span class="level-badge">LEVEL ${String(level.id).padStart(2, "0")} / 15</span>
            </div>
            <canvas id="storyCanvas" width="900" height="580" aria-label="${escapeHTML(level.title)}的场景插画"></canvas>
            <div class="scene-caption">点击选项 // 找出最符合嘉豪逻辑的回答</div>
          </div>
          <div class="dialog-card pixel-panel">
            <div class="speaker">
              <canvas class="speaker-avatar" id="speakerAvatar" width="120" height="170" aria-label="嘉豪头像"></canvas>
              <div>
                <p class="speaker-name">嘉豪</p>
                <p class="speaker-role">计算机专业 / 自我评价稳定</p>
              </div>
            </div>
            <h2 class="scene-title">${level.title}</h2>
            <div class="scene-copy">
              ${level.lines.map((line) => `<span>${escapeHTML(line)}</span>`).join("")}
              ${messageHTML}
            </div>
            <div class="choices" id="choices">
              ${optionOrder.map((originalIndex, index) => `
                <button class="choice" type="button" data-original="${originalIndex}">
                  <span class="choice-key">${String.fromCharCode(65 + index)}</span>
                  <span>${escapeHTML(level.options[originalIndex])}</span>
                </button>
              `).join("")}
            </div>
            <div class="feedback" id="storyFeedback" aria-live="polite">豪意值 ${state.hui} / 21 · 选择最像嘉豪的回答。</div>
          </div>
        </section>
      `);

      const artCanvas = document.getElementById("storyCanvas");
      requestAnimationFrame(() => drawSceneArt(artCanvas, level));
      const portrait = document.getElementById("speakerAvatar");
      const portraitCtx = portrait.getContext("2d");
      drawJiahao(portraitCtx, 18, 2, 4.7);

      const buttons = [...document.querySelectorAll(".choice")];
      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          chooseStoryOption(Number(button.dataset.original), buttons);
        });
      });
    }

    function chooseStoryOption(index, buttons) {
      const level = LEVELS[state.level];
      const feedback = document.getElementById("storyFeedback");
      if (buttons.some((button) => button.disabled)) return;
      const selected = buttons.find((button) => Number(button.dataset.original) === index);

      if (index !== 2) {
        audio.wrong();
        vibrate([18, 35, 18]);
        selected.classList.add("wrong");
        feedback.className = "feedback bad";
        feedback.innerHTML = "系统判定：<strong>豪意值没有变化。</strong><br>你又正常了一次。请重新组织语言。";
        later(() => selected.classList.remove("wrong"), 540);
        return;
      }

      buttons.forEach((button) => { button.disabled = true; });
      selected.classList.add("correct");
      state.tags[level.tag] += 1;
      addHui(selected);
      audio.correct();
      if (level.id === 6) later(() => audio.typingStorm(), 180);
      vibrate([12, 30, 18, 30, 35]);
      feedback.className = "feedback good";
      feedback.innerHTML = `<strong>豪意值 +1</strong> · ${state.hui} / 21<br>${level.feedback.map(escapeHTML).join("<br>")}`;
      later(() => {
        if (level.id % 5 === 0) {
          renderChallenge(level.chapter);
        } else {
          state.level += 1;
          renderStory();
        }
      }, 1850);
    }

    function renderChallenge(chapterIndex) {
      const chapter = CHAPTERS[chapterIndex];
      const challenge = chapter.challenge;
      setChapter(chapterIndex);
      setStage(`
        <section class="screen challenge-intro">
          <div class="challenge-art pixel-panel">
            <div class="challenge-glyph">${challenge.glyph}</div>
          </div>
          <div class="challenge-copy-card pixel-panel">
            <span class="eyebrow">INTERLUDE ${String(chapterIndex + 1).padStart(2, "0")}</span>
            <h2>${challenge.name}</h2>
            <p>${challenge.description}</p>
            <div class="challenge-hints">
              ${challenge.hints.map((hint, index) => `<div class="challenge-hint">${index + 1}. ${hint}</div>`).join("")}
            </div>
            <button class="primary-button" id="challengeStart" type="button">开始挑战</button>
          </div>
        </section>
      `);
      document.getElementById("challengeStart").addEventListener("click", () => startChallenge(chapterIndex));
    }

    function startChallenge(chapterIndex) {
      if (chapterIndex === 0) startNoteGame();
      if (chapterIndex === 1) startSkateGame();
      if (chapterIndex === 2) startWireGame();
    }

    function passChallenge(chapterIndex) {
      if (!state.challengeRewards[chapterIndex]) {
        state.challengeRewards[chapterIndex] = true;
        addHui(document.querySelector(".game-topline") || document.body);
      }
      audio.shutter();
      vibrate([20, 35, 75]);
      flashScreen();
      later(() => renderChallengeSuccess(chapterIndex), 340);
    }

    function renderChallengeSuccess(chapterIndex) {
      const challenge = CHAPTERS[chapterIndex].challenge;
      setChapter(chapterIndex);
      setStage(`
        <section class="screen success-screen">
          <div class="success-card">
            <span class="eyebrow">CHALLENGE CLEAR</span>
            <h2>挑战通过</h2>
            <p>${challenge.name}已完成。快门替你保留了这次高光，豪意值 +1。</p>
            <div class="chapter-steps" style="justify-content:center;margin-bottom:22px">
              <span class="chapter-step">豪意值 ${state.hui} / 21</span>
              <span class="chapter-step">照片待发送</span>
            </div>
            <button class="primary-button" id="goCheckin" type="button">去班级群打卡</button>
          </div>
        </section>
      `);
      document.getElementById("goCheckin").addEventListener("click", () => renderCheckin(chapterIndex));
    }

    function startNoteGame() {
      setChapter(0);
      setStage(`
        <section class="screen game-screen">
          <div class="game-topline">
            <span class="game-name">商场拍拍机 // 全部点中 5 个音符</span>
            <span class="timer" id="gameTimer">15.0s</span>
          </div>
          <div class="booth-wrap">
            <div class="booth" id="booth">
              <div class="booth-bottom" id="noteCounter">已命中 0 / 5</div>
            </div>
          </div>
        </section>
      `);
      const booth = document.getElementById("booth");
      const timerEl = document.getElementById("gameTimer");
      const counterEl = document.getElementById("noteCounter");
      const positions = [
        [12, 20], [58, 16], [31, 43], [68, 54], [14, 67]
      ];
      const frequencies = [523.25, 659.25, 783.99, 987.77, 1174.66];
      let hits = 0;
      let over = false;
      const start = performance.now();

      positions.forEach(([left, top], index) => {
        const note = document.createElement("button");
        note.type = "button";
        note.className = "note-button";
        note.dataset.noBaseSound = "true";
        note.style.left = `${left}%`;
        note.style.top = `${top}%`;
        note.style.animationDelay = `${index * -0.13}s`;
        note.setAttribute("aria-label", `第 ${index + 1} 个音符`);
        note.textContent = index % 2 ? "♫" : "♪";
        note.addEventListener("click", () => {
          if (over || note.classList.contains("hit")) return;
          note.classList.add("hit");
          audio.note(frequencies[index]);
          vibrate(12);
          hits += 1;
          counterEl.textContent = `已命中 ${hits} / 5`;
          if (hits === 5) {
            over = true;
            counterEl.textContent = "全部命中 · SNAP!";
            later(() => passChallenge(0), 360);
          }
        });
        booth.appendChild(note);
      });

      animateLoop((now) => {
        if (over) return false;
        const remaining = Math.max(0, 15 - (now - start) / 1000);
        timerEl.textContent = `${remaining.toFixed(1)}s`;
        if (remaining <= 0) {
          over = true;
          audio.wrong();
          vibrate([25, 50, 25]);
          const overlay = document.createElement("div");
          overlay.className = "game-overlay";
          overlay.innerHTML = `
            <div class="overlay-card">
              <h2>音符溜走了</h2>
              <p>机器表示：反应速度暂时没有达到海外账号水平。</p>
              <button class="primary-button" id="retryNotes" type="button">再拍一次</button>
            </div>
          `;
          booth.parentElement.appendChild(overlay);
          document.getElementById("retryNotes").addEventListener("click", () => startNoteGame());
        }
      });
    }

    function startSkateGame() {
      setChapter(1);
      setStage(`
        <section class="screen game-screen">
          <div class="game-topline">
            <span class="game-name">校园轮滑 // 坚持 20 秒</span>
            <span class="timer" id="skateTimer">20.0s</span>
          </div>
          <div class="skate-frame" id="skateFrame">
            <canvas id="skateCanvas" width="900" height="420" aria-label="校园轮滑小游戏"></canvas>
            <div class="skate-hud">
              <span class="skate-chip" id="skateHp">♥♥♥</span>
              <span class="skate-chip">← → 换道</span>
            </div>
          </div>
          <div class="skate-controls">
            <button class="lane-button" id="laneLeft" type="button" aria-label="向左换道">←</button>
            <button class="lane-button" id="laneRight" type="button" aria-label="向右换道">→</button>
          </div>
        </section>
      `);
      const canvas = document.getElementById("skateCanvas");
      const ctx = canvas.getContext("2d");
      const frame = document.getElementById("skateFrame");
      const timerEl = document.getElementById("skateTimer");
      const hpEl = document.getElementById("skateHp");
      ctx.imageSmoothingEnabled = false;
      const lanes = [180, 450, 720];
      let lane = 1;
      let targetX = lanes[lane];
      let visualX = targetX;
      let hp = 3;
      let remaining = 20;
      let spawnClock = 0.4;
      let elapsed = 0;
      let over = false;
      let roadOffset = 0;
      let beeEventTriggered = false;
      let eventTextTime = 0;
      const obstacles = [];
      const obstacleTypes = ["pedestrian", "cart", "tree"];
      const playerY = 318;

      const move = (direction) => {
        if (over) return;
        const next = clamp(lane + direction, 0, 2);
        if (next !== lane) {
          lane = next;
          targetX = lanes[lane];
          audio.click();
          vibrate(7);
        }
      };

      document.getElementById("laneLeft").addEventListener("click", () => move(-1));
      document.getElementById("laneRight").addEventListener("click", () => move(1));
      canvas.addEventListener("pointerdown", (event) => {
        const rect = canvas.getBoundingClientRect();
        const localX = event.clientX - rect.left;
        move(localX < rect.width / 2 ? -1 : 1);
      });

      activeKeydown = (event) => {
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          move(-1);
        }
        if (event.key === "ArrowRight") {
          event.preventDefault();
          move(1);
        }
      };
      window.addEventListener("keydown", activeKeydown);

      const fail = () => {
        if (over) return false;
        over = true;
        audio.wrong();
        vibrate([28, 40, 28, 40, 45]);
        const overlay = document.createElement("div");
        overlay.className = "game-overlay";
        overlay.innerHTML = `
          <div class="overlay-card">
            <h2>轮滑已变成步行</h2>
            <p>材料还来得及。路线规划暂时不符合预期。</p>
            <button class="primary-button" id="retrySkate" type="button">重新出发</button>
          </div>
        `;
        frame.appendChild(overlay);
        document.getElementById("retrySkate").addEventListener("click", () => startSkateGame());
        return false;
      };

      const drawBeeMark = (beeX, beeY, size = 1) => {
        ctx.fillStyle = "#fff4c9";
        ctx.fillRect(beeX - 8 * size, beeY - 7 * size, 5 * size, 5 * size);
        ctx.fillRect(beeX + 3 * size, beeY - 7 * size, 5 * size, 5 * size);
        ctx.fillStyle = "#ffe86a";
        ctx.fillRect(beeX - 9 * size, beeY - 3 * size, 18 * size, 11 * size);
        ctx.fillStyle = "#21163b";
        ctx.fillRect(beeX - 4 * size, beeY - 3 * size, 3 * size, 11 * size);
        ctx.fillRect(beeX + 4 * size, beeY - 3 * size, 3 * size, 11 * size);
        ctx.fillRect(beeX - 11 * size, beeY, 2 * size, 2 * size);
      };

      const drawObstacle = (obstacle) => {
        const x = lanes[obstacle.lane];
        const y = obstacle.y;
        if (obstacle.type === "tree") {
          ctx.fillStyle = "#7a4429";
          ctx.fillRect(x - 9, y + 30, 18, 55);
          ctx.fillStyle = "#3bc873";
          ctx.fillRect(x - 42, y - 6, 84, 48);
          ctx.fillStyle = "#69f5c1";
          ctx.fillRect(x - 28, y - 28, 56, 32);
          ctx.fillStyle = "#21163b";
          ctx.fillRect(x - 34, y + 34, 8, 10);
          ctx.fillRect(x + 26, y + 34, 8, 10);
        } else if (obstacle.type === "cart" || obstacle.type === "beecart") {
          const isBeeCart = obstacle.type === "beecart";
          ctx.fillStyle = isBeeCart ? "#ffe86a" : "#ff9b42";
          ctx.fillRect(x - 46, y - 4, 92, 62);
          ctx.fillStyle = "#21163b";
          ctx.fillRect(x - 38, y + 6, 76, 24);
          ctx.fillStyle = "#ffe86a";
          ctx.fillRect(x - 26, y + 11, 32, 6);
          ctx.fillRect(x + 16, y + 11, 15, 6);
          drawBeeMark(x + 25, y - 3, 0.8);
          ctx.fillStyle = "#ff5d9e";
          ctx.fillRect(x - 34, y + 44, 20, 20);
          ctx.fillRect(x + 14, y + 44, 20, 20);
          ctx.fillStyle = "#fff4c9";
          ctx.font = "900 14px 'Microsoft YaHei'";
          ctx.fillText(isBeeCart ? "蜜蜂专送" : "外卖", x - 29, y + 25);
        } else if (obstacle.type === "angry") {
          ctx.strokeStyle = "#fff4c9";
          ctx.lineWidth = 5;
          for (let i = 0; i < 3; i += 1) {
            ctx.beginPath();
            ctx.moveTo(x - 30, y + 18 + i * 16);
            ctx.lineTo(x - 58, y + 18 + i * 16);
            ctx.stroke();
          }
          ctx.fillStyle = "#ff5d9e";
          ctx.fillRect(x - 22, y + 8, 44, 72);
          ctx.fillStyle = "#ffbf91";
          ctx.fillRect(x - 18, y - 20, 36, 34);
          ctx.fillStyle = "#21163b";
          ctx.fillRect(x - 19, y - 26, 38, 12);
          ctx.fillRect(x - 26, y + 78, 16, 30);
          ctx.fillRect(x + 10, y + 78, 16, 30);
          ctx.fillStyle = "#21163b";
          ctx.fillRect(x - 11, y - 8, 6, 5);
          ctx.fillRect(x + 7, y - 8, 6, 5);
          ctx.fillRect(x - 8, y + 2, 18, 7);
        } else {
          ctx.fillStyle = "#8f68ff";
          ctx.fillRect(x - 22, y + 10, 44, 70);
          ctx.fillStyle = "#f3b98b";
          ctx.fillRect(x - 17, y - 18, 34, 32);
          ctx.fillStyle = "#171126";
          ctx.fillRect(x - 18, y - 24, 36, 12);
          ctx.fillStyle = "#21163b";
          ctx.fillRect(x - 25, y + 78, 16, 24);
          ctx.fillRect(x + 9, y + 78, 16, 24);
        }
      };

      animateLoop((now, dt) => {
        if (over) return false;
        elapsed += dt;
        remaining = Math.max(0, 20 - elapsed);
        roadOffset = (roadOffset + dt * 260) % 64;
        visualX += (targetX - visualX) * Math.min(1, dt * 9);
        spawnClock -= dt;
        if (spawnClock <= 0) {
          const obstacleLane = Math.floor(Math.random() * 3);
          obstacles.push({
            lane: obstacleLane,
            y: -70,
            type: obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)]
          });
          spawnClock = 0.62 + Math.random() * 0.35;
        }

        if (!beeEventTriggered && elapsed >= 6) {
          beeEventTriggered = true;
          eventTextTime = 3.4;
          const eventLane = Math.floor(Math.random() * 3);
          obstacles.push({
            lane: eventLane,
            y: -56,
            type: "beecart",
            speed: 320
          });
          for (let index = 0; index < 3; index += 1) {
            obstacles.push({
              lane: eventLane,
              y: -132 - index * 66,
              type: "angry",
              speed: 360 + index * 22
            });
          }
          audio.buzz();
          vibrate([25, 30, 20, 30, 45]);
        }

        const speed = 225 + elapsed * 7;
        for (let i = obstacles.length - 1; i >= 0; i -= 1) {
          const obstacle = obstacles[i];
          obstacle.y += (obstacle.speed || speed) * dt;
          const verticalHit = obstacle.y > playerY - 38 && obstacle.y < playerY + 70;
          const horizontalHit = Math.abs(visualX - lanes[obstacle.lane]) < 58;
          if (verticalHit && horizontalHit) {
            obstacles.splice(i, 1);
            hp -= 1;
            hpEl.textContent = `${"♥".repeat(Math.max(0, hp))}${"♡".repeat(Math.max(0, 3 - hp))}`;
            audio.wrong();
            vibrate([25, 30, 25]);
            frame.animate(
              [
                { transform: "translateX(0)" },
                { transform: "translateX(-8px)" },
                { transform: "translateX(8px)" },
                { transform: "translateX(0)" }
              ],
              { duration: 220, iterations: 1 }
            );
            if (hp <= 0) return fail();
            continue;
          }
          if (obstacle.y > canvas.height + 90) obstacles.splice(i, 1);
        }

        timerEl.textContent = `${remaining.toFixed(1)}s`;

        const sky = ctx.createLinearGradient(0, 0, 0, 420);
        sky.addColorStop(0, "#50cfff");
        sky.addColorStop(0.38, "#9ff4e5");
        sky.addColorStop(0.39, "#ffbd55");
        sky.addColorStop(1, "#ff6da4");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, 900, 420);

        ctx.fillStyle = "rgba(255,244,201,.55)";
        ctx.fillRect(80, 72, 120, 92);
        ctx.fillRect(230, 42, 150, 122);
        ctx.fillRect(590, 60, 116, 104);
        ctx.fillRect(735, 90, 100, 74);
        ctx.fillStyle = "#21163b";
        for (let i = 0; i < 4; i += 1) {
          ctx.fillRect(96 + i * 26, 90, 14, 18);
          ctx.fillRect(247 + i * 32, 62, 15, 20);
          ctx.fillRect(608 + i * 26, 82, 14, 18);
        }

        ctx.fillStyle = "#4e3b78";
        ctx.fillRect(0, 156, 900, 264);
        ctx.fillStyle = "#ffe86a";
        ctx.fillRect(0, 156, 900, 10);
        ctx.fillStyle = "#76e59e";
        ctx.fillRect(0, 166, 66, 254);
        ctx.fillRect(834, 166, 66, 254);

        const sides = [34, 866];
        sides.forEach((x, index) => {
          [215, 338].forEach((y, treeIndex) => {
            const offset = ((treeIndex * 73 + index * 31 + roadOffset * 0.18) % 120);
            ctx.fillStyle = "#6c442d";
            ctx.fillRect(x - 7, y + offset + 37, 14, 54);
            ctx.fillStyle = treeIndex % 2 ? "#43d77d" : "#69f5c1";
            ctx.fillRect(x - 28, y + offset, 56, 44);
            ctx.fillStyle = "#21163b";
            ctx.fillRect(x - 20, y + offset + 10, 10, 8);
            ctx.fillRect(x + 10, y + offset + 10, 10, 8);
          });
        });

        ctx.fillStyle = "#fff4c9";
        [300, 600].forEach((x) => {
          for (let y = 170; y < 420; y += 64) {
            ctx.fillRect(x - 4, y + roadOffset, 8, 34);
          }
        });

        obstacles.forEach(drawObstacle);

        if (eventTextTime > 0) {
          eventTextTime -= dt;
          const bubbleWidth = 470;
          const bubbleX = (canvas.width - bubbleWidth) / 2;
          ctx.fillStyle = "#fff4c9";
          ctx.fillRect(bubbleX, 64, bubbleWidth, 56);
          ctx.strokeStyle = "#21163b";
          ctx.lineWidth = 4;
          ctx.strokeRect(bubbleX, 64, bubbleWidth, 56);
          ctx.fillStyle = "#21163b";
          ctx.font = "900 18px 'Microsoft YaHei'";
          ctx.fillText("蜜蜂之家！我辛苦那么久工资都不发给我！", bubbleX + 25, 99);
        }

    function startWireGame() {
      setChapter(2);
      setStage(`
        <section class="screen game-screen">

            </div>

              <span class="cable-symbol">⚡</span><span>电源线</span>
            </button>
            <button class="cable" type="button" data-kind="network" data-home-left="42%" data-home-right="auto" style="left:42%;right:auto;bottom:6%;--cable-color:#ffe86a">
              <span class="cable-symbol">⌁</span><span>网线</span>
            </button>
            <button class="cable" type="button" data-kind="display" data-home-left="auto" data-home-right="7%" style="left:auto;right:7%;bottom:6%;--cable-color:#50e3ff">
              <span class="cable-symbol">▣</span><span>显示线</span>
            </button>
          </div>
        </section>
      `);
      const board = document.getElementById("wireBoard");
      const timerEl = document.getElementById("wireTimer");
      const screen = document.getElementById("projectorScreen");
      const cables = [...document.querySelectorAll(".cable")];
      const ports = [...document.querySelectorAll(".port")];
      let connected = 0;
      let elapsed = 0;
      let over = false;

      const resetCable = (cable) => {
        cable.classList.remove("dragging", "wrong");
        cable.style.left = cable.dataset.homeLeft;
        cable.style.right = cable.dataset.homeRight;
        cable.style.top = "auto";
        cable.style.bottom = "6%";
      };

      const finish = () => {
        if (over) return;
        over = true;
        screen.classList.add("on");
        screen.innerHTML = "<strong>BUILD SUCCESSFUL</strong><br>谢谢大家";
        audio.success();
        vibrate([20, 30, 50]);
        later(() => passChallenge(2), 900);
      };

      const connect = (cable, port) => {
        cable.classList.add("connected");
        cable.style.pointerEvents = "none";
        port.classList.add("active");
        port.disabled = true;
        connected += 1;
        audio.connect();
        vibrate([12, 20, 30]);
        if (connected === 3) finish();
      };

      cables.forEach((cable) => {
        cable.addEventListener("pointerdown", (event) => {
          if (over || cable.classList.contains("connected")) return;
          event.preventDefault();
          audio.ensure();
          vibrate(8);
          const boardRect = board.getBoundingClientRect();
          const cableRect = cable.getBoundingClientRect();
          const offsetX = event.clientX - cableRect.left;
          const offsetY = event.clientY - cableRect.top;
          cable.classList.add("dragging");
          cable.style.right = "auto";
          cable.style.bottom = "auto";
          cable.style.left = `${cableRect.left - boardRect.left}px`;
          cable.style.top = `${cableRect.top - boardRect.top}px`;
          try { cable.setPointerCapture(event.pointerId); } catch (_) {}

          const onMove = (moveEvent) => {
            const left = moveEvent.clientX - boardRect.left - offsetX;
            const top = moveEvent.clientY - boardRect.top - offsetY;
            cable.style.left = `${clamp(left, -10, boardRect.width - cable.offsetWidth + 10)}px`;
            cable.style.top = `${clamp(top, 0, boardRect.height - cable.offsetHeight)}px`;
          };

          const onUp = (upEvent) => {
            cable.removeEventListener("pointermove", onMove);
            cable.removeEventListener("pointerup", onUp);
            cable.removeEventListener("pointercancel", onUp);
            try { cable.releasePointerCapture(event.pointerId); } catch (_) {}
            const targetPort = ports.find((port) => {
              if (port.disabled) return false;
              const rect = port.getBoundingClientRect();
              return upEvent.clientX >= rect.left - 18 &&
                upEvent.clientX <= rect.right + 18 &&
                upEvent.clientY >= rect.top - 18 &&
                upEvent.clientY <= rect.bottom + 18;
            });
            cable.classList.remove("dragging");
            if (targetPort && targetPort.dataset.kind === cable.dataset.kind) {
              connect(cable, targetPort);
            } else {
              cable.classList.add("wrong");
              audio.wrong();
              vibrate(20);
              later(() => resetCable(cable), 180);
            }
          };

          cable.addEventListener("pointermove", onMove);
          cable.addEventListener("pointerup", onUp);
          cable.addEventListener("pointercancel", onUp);
        });
      });

      animateLoop((now, dt) => {
        if (over) return false;
        elapsed += dt;
        const remaining = Math.max(0, 20 - elapsed);
        timerEl.textContent = `${remaining.toFixed(1)}s`;
        if (remaining <= 0) {
          over = true;
          audio.wrong();
          vibrate([25, 40, 25]);
          const overlay = document.createElement("div");
          overlay.className = "game-overlay";
          overlay.innerHTML = `
            <div class="overlay-card">
              <h2>答辩仍在等待信号</h2>
              <p>三根线中至少还有一根坚持自己的接口判断。</p>
              <button class="primary-button" id="retryWire" type="button">重新接线</button>
            </div>
          `;
          board.appendChild(overlay);
          document.getElementById("retryWire").addEventListener("click", () => startWireGame());
          return false;
        }
        return true;
      });
    }

        size: 18 + (index % 3) * 6,

      }));

        { text: "PPT", x: 132, y: 510, color: "#ff9b42" },

      ];
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let endingShown = false;

        `;
